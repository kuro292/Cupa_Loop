<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CUPA LOOP</title>
    <link rel="stylesheet" href="../style/custom.css">
    <link rel="stylesheet" href="../style/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="../style/bootstrap/css/bootstrap-grid.css">
    <link rel="stylesheet" href="../style/bootstrap/css/bootstrap-utilities.css">
    <link rel="stylesheet" href="../style/bootstrap-icons-1.13.1/bootstrap-icons.css">
    <link rel="stylesheet" href="../style/sweetalert2/sweetalert2.min.css">
</head>
<body class="bg-light page-auth">
    
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
            <div class="card-body p-5">
                
                <div class="mb-4">
                    <a href="../index.html" class="text-decoration-none text-muted small">
                        <i class="bi bi-arrow-left"></i> Volver al inicio
                    </a>
                </div>

                <div class="text-center mb-4">
                    <i class="bi bi-recycle text-success display-4"></i>
                    <h2 class="fw-bold text-success mt-2">CUPA LOOP</h2>
                    <p class="text-muted">Acceso al Sistema</p>
                </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuario Universitario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" id="txtIdentificador" class="form-control" placeholder="ID o Correo" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" id="txtPassword" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div id="mensajeError" class="alert alert-danger py-2 small" role="alert" style="display: none;"></div>
                    
                    <button type="button" class="btn btn-success w-100 py-2 mb-3 fw-bold" onclick="login()">Ingresar</button>

                    <div class="text-center mt-3">
                        <a href="#" class="text-success small text-decoration-none">¿Olvidaste tu contraseña?</a>
                    </div>

            </div>
        </div>
    </div>
    
    <script src="../js/login.js"></script>
    <script src="../style/sweetalert2/sweetalert2.min.js"></script>
    <script src="../style/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
