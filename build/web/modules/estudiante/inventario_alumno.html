<main class="w-100 layout-main fade-in">
    <div class="row align-items-center mb-4">
        <div class="col-md-4">
            <h2 class="fw-bold text-dark mb-1"><i class="bi bi-grid-3x3-gap text-success me-2"></i>Catálogo Tecnológico</h2>
            <p class="text-muted small mb-0">Explora el E-Waste disponible para solicitar piezas.</p>
        </div>
        <div class="col-md-4 text-start mt-3 mt-md-0">
            <div class="input-group" style="max-width: 300px;">
                <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="filtroBusquedaAlumno" class="form-control border-start-0" placeholder="Buscar equipos..." onkeyup="buscarProductosAlumno(this.value)">
            </div>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <div class="d-flex justify-content-md-end align-items-center gap-2">
                <label for="filtroCategoria" class="fw-bold small text-muted mb-0">Filtrar:</label>
                <select id="filtroCategoria" class="form-select border-success shadow-sm" style="max-width: 200px;" onchange="filtrarPorCategoria(this.value)">
                    <option value="">Todas las categorías</option>
                    <option value="1">Computadoras</option>
                    <option value="2">Monitores</option>
                    <option value="3">Periféricos</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light border-bottom">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Tipo</th>
                            <th>Nombre</th>
                            <th>Descripcion</th>
                            <th>Condicion</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center pe-4">Accion</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyInventarioAlumno">
                        <tr>
                            
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
