<main class="w-100 layout-main fade-in">
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2 class="fw-bold text-dark mb-1"><i class="bi bi-list-ul text-success me-2"></i>Inventario de productos</h2>
            <p class="text-muted small mb-0">Listado general del E-Waste almacenado en CUPA LOOP.</p>
        </div>
        <div class="col-md-6 text-md-end mt-3 mt-md-0">
            <div class="input-group" style="max-width: 300px; margin-left: auto;">
                <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="filtroInventario" class="form-control border-start-0" placeholder="Buscar ID o nombre..." onkeyup="buscarProductos(this.value)">
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light border-bottom">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Tipo</th>
                            <th>Nombre</th>
                            <th>Descripcion</th>
                            <th>Condicion</th>
                            <th>Estado</th>
                            <th>Fecha Ingreso</th>
                            <th>Fecha Salida</th>
                            <th>Usuario</th>
                            <th class="text-center pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyInventario">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">Cargando inventario...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
