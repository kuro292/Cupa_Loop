<main class="w-100 layout-main fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1"><i class="bi bi-receipt text-info me-2"></i>Mis Solicitudes</h2>
            <p class="text-muted small mb-0">Historial de tus solicitudes de productos.</p>
        </div>
        <button class="btn btn-outline-secondary btn-sm" onclick="cargarMisPedidos()"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-borderless align-middle mb-0">
                    <thead class="table-light border-bottom">
                        <tr>
                            <th class="ps-4">Folio</th>
                            <th>Producto</th>
                            <th>Fecha Solicitud</th>
                            <th>Motivo</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center pe-4">Comentario Admin</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyMisPedidos">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">Cargando solicitudes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
