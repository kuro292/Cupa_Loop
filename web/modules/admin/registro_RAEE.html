Email:      robledonegrete@gmail.com
Comments:   Módulo Registro RAEE. Formulario para agregar/registrar nuevos
            residuos tecnológicos (E-Waste) donados al sistema CUPA LOOP.

Version:    1.1
Date:       2025-02-21
Author:     Robledo Negrete Juan Antonio
Email:      robledonegrete@gmail.com
Comments:   Cambio de estilos. Agregado el select #cmbTipo (Tipo de Dispositivo)
            que se pobla dinámicamente desde la base de datos al cargar el módulo.
-->

<!-- Contenedor principal del módulo -->
<main class="w-100 layout-main fade-in">

    <!-- Centrado del formulario en pantallas grandes -->
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Encabezado del módulo -->
            <div class="mb-4 text-center">
                <h2 class="fw-bold text-dark mb-1">
                    <i class="bi bi-pc-display text-success me-2"></i>Registrar E-Waste
                </h2>
                <p class="text-muted small">
                    Ingresa un nuevo residuo tecnológico (RAEE) al sistema CUPA LOOP.
                </p>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-5">

                    <div class="row">

                        <!-- 
                             Campo: Tipo de Dispositivo
                             El select se pobla dinámicamente con cargarCategorias()
                             al inicializar el módulo. El option inicial es un 
                             placeholder deshabilitado que indica el estado de carga.
                        -->
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">
                                Tipo de Dispositivo
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-tag"></i>
                                </span>
                                <select class="form-select" id="cmbTipo">
                                    <!-- 
                                        Opción temporal reemplazada por cargarCategorias().
                                        "selected disabled" evita que se envíe vacío.
                                    -->
                                    <option selected disabled>Cargando categorías...</option>
                                </select>
                            </div>
                        </div>

                        <!-- Campo: Nombre o modelo del equipo (texto libre) -->
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">
                                Nombre / Modelo
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-pencil"></i>
                                </span>
                                <input type="text"
                                       class="form-control"
                                       id="txtNombre"
                                       placeholder="Ej. Dell OptiPlex 3020, HP LaserJet Pro...">
                            </div>
                        </div>

                    </div>

                    <!-- Campo: Estado/condición inicial del equipo (valores fijos) -->
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">
                                Estado Inicial del Equipo
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">
                                    <i class="bi bi-activity"></i>
                                </span>
                                <select class="form-select" id="cmbEstado">
                                    <option selected disabled>Evaluación física...</option>
                                    <option value="FUNCIONAL">Funcional (Donación)</option>
                                    <option value="REPARABLE">Dañado (Reparable)</option>
                                    <option value="OBSOLETO">Obsoleto (Solo piezas/Reciclaje)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Campo: Descripción libre marca, observaciones, número de serie -->
                    <div class="col-12 mt-3">
                        <label class="form-label fw-bold small text-muted">
                            Descripción, Marca o Número de Serie
                        </label>
                        <textarea class="form-control"
                                  id="txtDescripcion"
                                  rows="3"
                                  placeholder="Ej. Monitor HP L1710, pantalla rayada pero enciende. SN: XYZ123...">
                        </textarea>
                    </div>

                    <!-- 
                         Botones de acción:
                         - "Limpiar": type="reset" vacía todos los campos del formulario.
                         - "Guardar Registro": llama a registrarProducto() para enviar datos.
                    -->
                    <div class="col-12 pt-3 border-top d-flex justify-content-end gap-2">
                        <button type="reset" class="btn btn-light px-4">Limpiar</button>
                        <button type="button"
                                class="btn btn-success px-5"
                                onclick="registrarProducto()">
                            <i class="bi bi-check-circle me-2"></i>Guardar Registro
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>

</main>
